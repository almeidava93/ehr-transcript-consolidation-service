[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.139.2",
    "jsonlines>=4.0.0",
    "openai-agents[redis]>=0.18.3",
    "toml>=0.10.2",
    "tqdm>=4.69.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.69.0.20260720",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "api",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = ""
