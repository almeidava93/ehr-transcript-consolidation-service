apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: ehr-transcript-consolidation-service
  labels:
    app.kubernetes.io/name: mysql-deployment
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ehr-transcript-consolidation-service

spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-pod
      app.kubernetes.io/component: database

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-pod
        app.kubernetes.io/component: database

    spec:
      containers:
      - image: mysql:latest
        name: mysql
        envFrom:
          - secretRef:
              name: mysql-secret
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql

      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pv-claim