apiVersion: v1
kind: Service

metadata:
  name: api # service DNS hostname
  namespace: ehr-transcript-consolidation-service
  labels:
    app: api-service

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: api-pod
    app.kubernetes.io/component: backend

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http

  sessionAffinity: None
  internalTrafficPolicy: Cluster # allows traffic originating within the cluster to be sent to matching endpoints on any node