apiVersion: apps/v1
kind: Deployment
metadata: # Deployment metadata
  name: api-deployment
  namespace: ehr-transcript-consolidation-service
  labels:
    app.kubernetes.io/name: api-deployment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ehr-transcript-consolidation-service

spec: # Deployment specification
  # replicas managed by HPA
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  minReadySeconds: 10

  strategy:
    type: RollingUpdate # default
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  selector:
    matchLabels:
      app.kubernetes.io/name: api-pod
      app.kubernetes.io/component: backend

  template: # Pod template 
    metadata: # Pod metadata
      labels:
        app.kubernetes.io/name: api-pod
        app.kubernetes.io/component: backend

    spec: # Pod specification
      containers:
      - name: api
        image: api:latest
        imagePullPolicy: IfNotPresent # default

        envFrom:
        - secretRef:
            name: api-secrets
            optional: false

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"

        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5