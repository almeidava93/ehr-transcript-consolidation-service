apiVersion: v1
kind: Service

metadata:
  name: frontend # service DNS hostname
  namespace: ehr-transcript-consolidation-service
  labels:
    app: frontend-service

spec:
  type: LoadBalancer 

  selector:
    app.kubernetes.io/name: frontend-pod
    app.kubernetes.io/component: frontend

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http

  sessionAffinity: None
  internalTrafficPolicy: Cluster # allows traffic originating within the cluster to be sent to matching endpoints on any node