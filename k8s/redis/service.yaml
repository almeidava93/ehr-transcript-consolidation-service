apiVersion: v1
kind: Service

metadata:
  name: redis-service # service DNS hostname
  namespace: ehr-transcript-consolidation-service
  labels:
    app: redis-service

spec:
  type: ClusterIP 

  selector:
    app.kubernetes.io/name: redis-pod
    app.kubernetes.io/component: backend

  ports:
    - name: http
      protocol: TCP
      port: 6379
      targetPort: http

  sessionAffinity: None
  internalTrafficPolicy: Cluster # allows traffic originating within the cluster to be sent to matching endpoints on any node