services:
  api:
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8080
      --reload
      --reload-dir /app/api

    environment:
      WATCHFILES_FORCE_POLLING: "true"

    volumes:
      - type: bind
        source: ./services/api/api
        target: /app/api

  frontend:
    build:
      target: builder
    command: npm run dev
    environment:
      API_BASE_URL: http://api:8080
      # Reliable file watching for bind mounts on Windows/Docker.
      WATCHPACK_POLLING: "true"
    volumes:
      - type: bind
        source: ./services/frontend/app
        target: /app/app