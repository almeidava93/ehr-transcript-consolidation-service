name: Run Tests, Format Code, and Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests-formatter-and-linter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
            python-version: ${{ matrix.python-version }}
    
      - name: Install the project
        run: cd ./services/api && uv sync --all-extras --dev

      - name: Run tests
        run: cd ./services/api && uv run pytest

      - name: Run Ruff linter
        run: cd ./services/api && uv run ruff check .

      - name: Run MyPy type checker
        run: cd ./services/api && uv run mypy .