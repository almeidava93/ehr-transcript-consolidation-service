services:
  api:
    image: api
    build:
      context: ./services/api
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - ./services/api/.env
    volumes:
      - type: bind
        source: ./db
        target: /app/db

  frontend:
    image: frontend
    build:
      context: ./services/frontend
    ports:
      - 3000:3000
    environment:
      # Reached over the compose network, not the host port mapping.
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy