services:
  api:
    image: api
    build:
      context: ./services/api
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - ./services/api/.env
    environment:
      REDIS_URL: redis://redis-service:6379
    volumes:
      - type: bind
        source: ./db
        target: /app/db
    depends_on:
      mysql-service:
        condition: service_healthy

  frontend:
    image: frontend
    build:
      context: ./services/frontend
    ports:
      - 3000:3000
    environment:
      # Reached over the compose network, not the host port mapping.
      API_BASE_URL: http://api:8080


  redis-service:
    image: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mysql-service:
    image: mysql:8.4
    env_file:
      - ./services/api/.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root --password="$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data: